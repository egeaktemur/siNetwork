[project]
name = "sinetwork"
version = "0.1.0"
description = "Predict time series as a learned sum of sinusoids"
requires-python = ">=3.10"
dependencies = [
    "torch==2.6.0",
    "pandas",
    "numpy",
    "matplotlib",
    "holidays>=0.106",
]

[project.scripts]
train = "sinetwork.train:main"
report = "sinetwork.report:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sinetwork"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
